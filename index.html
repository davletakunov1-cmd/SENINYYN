<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    
    <!-- ВАЖНО: Эти мета-теги обеспечивают правильное отображение на мобильных и работу в Telegram Webview -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" /> <!-- Цвет фона браузера, если поддерживается -->
    
    <!-- Подключение иконок (замените на свои файлы в папке public) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- CRITICAL: ПОДКЛЮЧЕНИЕ TELEGRAM WEB APP SDK -->
    <!-- Этот скрипт предоставляет глобальный объект window.Telegram.WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <title>Rent App Bishkek</title>
    
    <!-- Небольшой стиль для устранения белой вспышки при загрузке и фиксации body -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Основной скролл будет внутри компонентов React */
        overscroll-behavior: none; /* Отключает эффект "резинки" при скролле на iOS/Android */
        background-color: var(--tg-theme-bg-color, #ffffff); /* Цвет фона по умолчанию */
        color: var(--tg-theme-text-color, #000000);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      
      #root {
        width: 100%;
        height: 100%;
        /* Это позволяет скроллить контент внутри приложения, если он превышает viewport */
        overflow-y: auto; 
        -webkit-overflow-scrolling: touch;
      }
      
      /* Скрытие стандартного скроллбара */
      #root::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Если JavaScript отключен в браузере (или Webview), пользователь увидит это -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Сюда монтируется ваше React-приложение -->
    <div id="root"></div>
    
  </body>
</html>
