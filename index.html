<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    
    <!-- ВАЖНО: Эти мета-теги обеспечивают правильное отображение на мобильных и работу в Telegram Webview -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Подключение иконок для Vite -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- CRITICAL: ПОДКЛЮЧЕНИЕ TELEGRAM WEB APP SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <title>Rent App Bishkek</title>
    
    <!-- Небольшой стиль для устранения белой вспышки при загрузке и фиксации body -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow-y: auto; 
        -webkit-overflow-scrolling: touch;
      }
      
      #root::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
